<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS110 Dome Signal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="signal-card">
      <p class="label">CS110 // Week 2</p>
      <h1>Hello, World</h1>

      <p class="message">
        Kairova dome signal received. The habitat is ready to welcome the next
        crew.
      </p>

      <p id="dome-status" class="status">Kairova status: online</p>
      <button id="signal-button" type="button">Confirm signal</button>

      <section class="crew-note" aria-labelledby="crew-note-title">
        <h2 id="crew-note-title">Next-crew instruction</h2>
        <p>Confirm the signal, then begin the morning airlock inspection.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
